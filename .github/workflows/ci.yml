name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  app:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    env:
      # Valores de mentira: el build solo necesita que existan
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  base-de-datos:
    name: Migraciones y tests de la base (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: con "latest" la acción consulta la API de GitHub y a veces
          # falla por límite de pedidos. Súbela cuando actualices la CLI local.
          version: 2.121.0
      - run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,mailpit,edge-runtime
      - run: supabase test db
